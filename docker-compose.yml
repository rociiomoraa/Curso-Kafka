services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks:
      - broker-kafka
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    networks:
      - broker-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafdrop:
    image: obsidiandynamics/kafdrop:3.31.0
    networks:
      - broker-kafka
    depends_on:
      - kafka
    ports:
      - "19000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092

  kafka-db:
    image: postgres:latest
    container_name: kafka_db_container
    networks:
      - broker-kafka
    restart: always
    environment:
      POSTGRES_DB: kafka_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5438:5432"
    volumes:
      - kafka_db_data:/var/lib/postgresql/data

  str-producer:
    image: rociiogarciia/str-producer:1.0.0
    networks:
      - broker-kafka
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    environment:
      KAFKA_HOST: kafka:29092

  str-consumer:
    image: rociiogarciia/str-consumer:1.0.0
    networks:
      - broker-kafka
    depends_on:
      - kafka
      - str-producer
      - kafka-db        
    ports:
      - "8100:8100"
    environment:
      KAFKA_HOST: kafka:29092
      DB_HOST: kafka-db
      DB_PORT: 5432     
      DB_NAME: kafka_db
      DB_USER: user
      DB_PASS: pass

networks:
  broker-kafka:
    driver: bridge

volumes:
  kafka_db_data: