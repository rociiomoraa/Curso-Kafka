server:
  port: ${PORT:8100}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:29092}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/${DB_NAME:kafka_db}
    username: ${DB_USER:user}
    password: ${DB_PASS:pass}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE